[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "alp-tools"
version = "0.1.0"
description = "ALP (Agent Learning Protocol) — tools for creating and navigating agent learning vaults"
authors = [{name = "ALP Contributors"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
alp-extract = "alp_tools.extract:main"
alp-learn = "alp_tools.learn:main"
alp-validate = "alp_tools.validate:main"

[tool.setuptools.packages.find]
include = ["alp_tools*"]
